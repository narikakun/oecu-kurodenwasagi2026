<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>電話</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap');
    :root { --ink:#21170f; --paper:#d8c39c; --paper2:#ead9b8; --green:#687450; --gold:#b88b42; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#17100b; font-family:"LINE Seed JP","Hiragino Sans","Yu Gothic",sans-serif; }
    .frame { position:relative; width:min(100vw,1080px); height:100vh; margin:auto; padding:3.2vh 4vw; display:flex; flex-direction:column; background:radial-gradient(circle at 30% 15%,#ead9b8,#c4a97d 72%,#9c7a52); border:clamp(10px,2vw,28px) solid #342014; box-shadow:inset 0 0 40px #3a2417; }
    #settings { display:none; flex:1; min-height:0; flex-direction:column; padding:clamp(22px,3.4vh,46px); text-align:left; background:rgba(43,29,18,.94); color:#f2dfb8; border:3px solid var(--gold); border-radius:18px; overflow:auto; }
    .settings-header { padding-bottom:2vh; border-bottom:1px solid rgba(242,223,184,.34); }
    .settings-title { margin:0; font-size:clamp(36px,5.2vw,64px); line-height:1.2; }
    .settings-subtitle { margin:.55em 0 0; color:#d9bd86; font-size:clamp(20px,2.5vw,32px); }
    .settings-content { display:grid; gap:1.5vh; margin:2vh 0; }
    .settings-section { padding:1.2vh 1.5vw; background:rgba(234,217,184,.08); border-left:6px solid var(--gold); border-radius:8px; }
    .settings-section h2 { margin:0 0 .55em; color:#d9bd86; font-size:clamp(19px,2.2vw,29px); }
    .settings-item { margin:.28em 0; font-size:clamp(20px,2.45vw,32px); line-height:1.45; overflow-wrap:anywhere; }
    .settings-choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 16px; margin-top:auto; }
    .settings-choice { padding:.55em .75em; background:var(--paper2); color:var(--ink); border-radius:8px; font-size:clamp(19px,2.2vw,29px); font-weight:700; }
    .settings-footer { margin:2vh 0 0; padding-top:1.4vh; border-top:1px solid rgba(242,223,184,.34); color:#f3ce84; text-align:center; font-size:clamp(20px,2.35vw,31px); font-weight:700; }
    .settings-legacy { margin:auto; white-space:pre-wrap; text-align:center; font-size:clamp(24px,3.4vw,48px); line-height:1.8; }
    .frame.settings-mode #settings { display:flex; }
    .frame.settings-mode #messages { display:none; }
    #status { display:none; flex:1; align-items:center; justify-content:center; color:rgba(33,23,15,.68); font-size:clamp(52px,8vw,104px); font-weight:700; letter-spacing:.28em; }
    .frame.status-mode #status { display:flex; }
    .frame.status-mode #messages, .frame.status-mode #settings, .frame.status-mode #feedback { display:none; }
    #feedback { display:none; flex:0 1 54vh; min-height:0; align-items:center; justify-content:center; padding:.5vh 0 1.5vh; }
    #feedback img { display:block; max-width:100%; max-height:52vh; object-fit:contain; border:2px solid rgba(72,48,25,.35); border-radius:10px; box-shadow:0 5px 18px rgba(48,29,15,.24); }
    .frame.feedback-mode #feedback { display:flex; }
    .frame.feedback-mode #messages { min-height:0; padding:1.2vh 0 0; border-top:2px solid rgba(72,48,25,.24); }
    .frame.settings-mode #feedback { display:none; }
    #messages { flex:1; overflow-y:auto; padding:2.5vh 0; scroll-behavior:smooth; }
    .welcome { text-align:center; margin-top:24vh; opacity:.65; font-size:clamp(36px,4.5vw,60px); line-height:1.6; }
    .message { display:flex; margin:0 0 2.2vh; animation:appear .2s ease-out; }
    .message.user { justify-content:flex-end; }
    .bubble { max-width:92%; padding:.8em .95em; background:var(--paper2); border:1px solid rgba(72,48,25,.3); border-radius:8px 22px 22px 22px; box-shadow:0 4px 12px rgba(48,29,15,.18); white-space:pre-wrap; overflow-wrap:anywhere; font-size:clamp(54px,7.5vw,96px); line-height:1.35; }
    .user .bubble { background:var(--green); color:#10150c; border-radius:22px 8px 22px 22px; }
    .partial .bubble { opacity:.64; border-style:dashed; }
    #disconnected { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(42px,7vw,90px); letter-spacing:.35em; color:rgba(33,23,15,.65); }
    #disconnected.hidden { display:none; }
    @keyframes appear { from { transform:translateY(10px); opacity:0; } }
  </style>
</head>
<body>
  <main class="frame">
    <section id="settings"></section>
    <section id="status" aria-live="polite"></section>
    <section id="feedback" aria-label="還付金詐欺への注意">
      <img alt="還付金詐欺にご用心">
    </section>
    <section id="messages"></section>
    <div id="disconnected" aria-label="再接続中">・・・</div>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const frame = document.querySelector('.frame');
    const settingsBox = document.querySelector('#settings');
    const statusBox = document.querySelector('#status');
    const feedbackBox = document.querySelector('#feedback');
    const feedbackImage = feedbackBox.querySelector('img');
    const disconnected = document.querySelector('#disconnected');
    const partials = new Map();

    function reset() {
      messages.innerHTML = '';
      frame.classList.remove('settings-mode');
      frame.classList.remove('status-mode');
      frame.classList.remove('feedback-mode');
      settingsBox.textContent = ''; statusBox.textContent = ''; partials.clear();
    }
    function addText(parent, className, text, tag = 'div') {
      const node = document.createElement(tag);
      node.className = className; node.textContent = text; parent.appendChild(node);
      return node;
    }
    function renderSettings(event) {
      settingsBox.replaceChildren();
      if (!event.title) {
        addText(settingsBox, 'settings-legacy', event.text || ''); return;
      }
      const header = document.createElement('header'); header.className = 'settings-header';
      addText(header, 'settings-title', event.title, 'h1');
      if (event.subtitle) addText(header, 'settings-subtitle', event.subtitle, 'p');
      settingsBox.appendChild(header);
      const content = document.createElement('div'); content.className = 'settings-content';
      (event.sections || []).forEach(section => {
        const card = document.createElement('section'); card.className = 'settings-section';
        if (section.heading) addText(card, '', section.heading, 'h2');
        (section.items || []).forEach(item => addText(card, 'settings-item', item));
        content.appendChild(card);
      });
      settingsBox.appendChild(content);
      if (event.choices?.length) {
        const choices = document.createElement('div'); choices.className = 'settings-choices';
        event.choices.forEach(choice => addText(choices, 'settings-choice', choice));
        settingsBox.appendChild(choices);
      }
      if (event.footer) addText(settingsBox, 'settings-footer', event.footer);
    }
    function transcript(event) {
      frame.classList.remove('status-mode'); statusBox.textContent = '';
      const key = event.speaker;
      let row = partials.get(key);
      if (event.status === 'partial') {
        if (!row) {
          row = document.createElement('div');
          row.className = `message ${key} partial`;
          row.innerHTML = `<div class="bubble"><span class="text"></span></div>`;
          messages.appendChild(row); partials.set(key, row);
        }
        row.querySelector('.text').textContent = event.text;
      } else {
        row = row || document.createElement('div');
        if (!row.parentNode) messages.appendChild(row);
        row.className = `message ${key}`;
        row.innerHTML = `<div class="bubble"><span class="text"></span></div>`;
        row.querySelector('.text').textContent = event.text;
        partials.delete(key);
      }
      messages.scrollTop = messages.scrollHeight;
    }
    function feedback(event) {
      if (event.active === false) {
        frame.classList.remove('feedback-mode'); return;
      }
      frame.classList.remove('settings-mode'); frame.classList.remove('status-mode');
      settingsBox.textContent = ''; statusBox.textContent = '';
      messages.replaceChildren(); partials.clear();
      feedbackImage.src = event.image || 'refund-fraud-warning.png';
      feedbackImage.alt = event.alt || '還付金詐欺にご用心';
      frame.classList.add('feedback-mode');
    }
    function apply(event) {
      if (event.type === 'reset') return reset();
      if (event.type === 'state') {
        if (event.state === 'connecting') {
          frame.classList.remove('settings-mode'); frame.classList.add('status-mode');
          statusBox.textContent = '・・・'; statusBox.setAttribute('aria-label', '通話を準備中');
        } else if (event.state === 'error') {
          frame.classList.remove('settings-mode'); frame.classList.add('status-mode');
          statusBox.textContent = '接続できませんでした'; statusBox.setAttribute('aria-label', event.label || '接続エラー');
        } else {
          frame.classList.remove('status-mode'); statusBox.textContent = '';
        }
        return;
      }
      if (event.type === 'transcript') return transcript(event);
      if (event.type === 'feedback') return feedback(event);
      if (event.type === 'settings') {
        if (event.active === false) {
          frame.classList.remove('settings-mode'); settingsBox.textContent = ''; return;
        }
        frame.classList.remove('status-mode'); frame.classList.remove('feedback-mode');
        statusBox.textContent = '';
        frame.classList.add('settings-mode');
        renderSettings(event);
      }
    }
    function connect() {
      const socket = new WebSocket(`ws://${location.hostname}:8765`);
      socket.onopen = () => disconnected.classList.add('hidden');
      socket.onmessage = ({data}) => {
        const event = JSON.parse(data);
        if (event.type === 'snapshot') { reset(); event.events.forEach(apply); }
        else apply(event);
      };
      socket.onerror = () => socket.close();
      socket.onclose = () => {
        disconnected.classList.remove('hidden');
        setTimeout(connect, 1000);
      };
    }
    connect();
  </script>
</body>
</html>
